{% extends "base_modern.html" %}
{% block title %}Internship Application | MineRush{% endblock %}
{% block content %}
<section class="page-shell">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10">
        <div class="mb-4">
          <p class="eyebrow mb-1">Application</p>
          <h1 class="page-title mb-2">Internship Application Form</h1>
          <p class="text-secondary mb-0">Submit your details and PDF resume. The form saves asynchronously and keeps you on this page.</p>
        </div>

        <form class="surface p-3 p-md-4" id="applicationForm" action="{{ url_for('submit_application') }}" method="post" enctype="multipart/form-data" data-async-form data-reset-on-success="true" novalidate>
          <div data-form-status class="alert" role="status" aria-live="polite" hidden></div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="name">Name</label>
              <input class="form-control" type="text" name="name" id="name" autocomplete="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="gender">Gender</label>
              <select class="form-select" name="gender" id="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Others">Others</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="dob">Birth Date</label>
              <input class="form-control" name="dob" id="dob" type="date" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="phone">Phone</label>
              <input class="form-control" type="tel" name="phone" id="phone" autocomplete="tel" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" type="email" name="email" id="email" autocomplete="email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="degree_branch">Degree and Branch</label>
              <input class="form-control" type="text" name="degree_branch" id="degree_branch" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="year_of_study">Year of Study</label>
              <select class="form-select" name="year_of_study" id="year_of_study" required>
                <option value="">Select year</option>
                <option value="1st year">1st year</option>
                <option value="2nd year">2nd year</option>
                <option value="3rd year">3rd year</option>
                <option value="4th year">4th year</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="company_name">Company Name</label>
              <input class="form-control" type="text" name="company_name" id="company_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="company_email">Company Email</label>
              <input class="form-control" type="email" name="company_email" id="company_email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="internship_role">Internship Title</label>
              <input class="form-control" type="text" name="internship_role" id="internship_role" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="address">Permanent Address</label>
              <textarea class="form-control" name="address" id="address" rows="3" required></textarea>
            </div>
            <div class="col-12">
              <label class="form-label" for="skills">Skills</label>
              <textarea class="form-control" name="skills" id="skills" rows="3" required></textarea>
            </div>
            <div class="col-12">
              <label class="form-label" for="resume">Resume Upload</label>
              <input class="form-control" type="file" name="resume" id="resume" accept="application/pdf,.pdf" required>
              <div class="form-text">PDF files only.</div>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="1" id="terms_check" name="terms_check" required>
                <label class="form-check-label" for="terms_check">I agree to the terms and conditions of the internship.</label>
              </div>
            </div>
            <div class="col-12 d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Submit Application
              </button>
              <button type="reset" class="btn btn-outline-secondary">Clear</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
