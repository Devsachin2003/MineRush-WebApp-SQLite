{% extends "base_modern.html" %}
{% block title %}Edit Profile | MineRush{% endblock %}
{% block content %}
<section class="page-shell">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="mb-4">
          <p class="eyebrow mb-1">Profile</p>
          <h1 class="page-title mb-2">Edit Profile</h1>
          <p class="text-secondary mb-0">Update your profile details and avatar without leaving the page.</p>
        </div>

        <form class="surface p-3 p-md-4" method="post" action="{{ url_for('edit_user_profile') }}" enctype="multipart/form-data" data-async-form>
          <div data-form-status class="alert" role="status" aria-live="polite" hidden></div>
          <div class="row g-4">
            <div class="col-md-4">
              <label class="form-label" for="picture">Avatar</label>
              <input class="form-control" type="file" name="picture" id="picture" accept=".jpg,.jpeg,.png,.webp">
              <div class="form-text">JPG, PNG, or WebP images are supported.</div>
            </div>
            <div class="col-md-8">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="name">Name</label>
                  <input class="form-control" type="text" name="name" id="name" value="{{ user.name }}" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="username">Username</label>
                  <input class="form-control" type="text" name="username" id="username" value="{{ user.username }}" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="role">Role</label>
                  <select class="form-select" name="role" id="role" required>
                    <option value="Stakeholder" {% if user.role == 'Stakeholder' %}selected{% endif %}>Stakeholder</option>
                    <option value="Customer" {% if user.role == 'Customer' %}selected{% endif %}>Customer</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="gender">Gender</label>
                  <select class="form-select" name="gender" id="gender" required>
                    <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Others" {% if user.gender == 'Others' %}selected{% endif %}>Others</option>
                  </select>
                </div>
                <div class="col-12 d-flex flex-wrap gap-2">
                  <button class="btn btn-primary" type="submit">
                    <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save
                  </button>
                  <a class="btn btn-outline-secondary" href="{{ url_for('profile') }}">Back to Profile</a>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
