{% extends "base_modern.html" %}
{% block title %}MineRushBot | MineRush{% endblock %}
{% block content %}
<section class="page-shell">
  <div class="container">
    <div class="surface p-4 text-center">
      <p class="eyebrow mb-1">AI assistant</p>
      <h1 class="page-title mb-2">MineRushBot</h1>
      <p class="text-secondary mb-4">Use the floating chat button to ask mining-law questions. The conversation loads asynchronously and remains in the page.</p>
      <button class="btn btn-primary" type="button" data-chat-toggle aria-controls="chatPanel" aria-expanded="false">
        <i class="fa-solid fa-comments" aria-hidden="true"></i> Open Chat
      </button>
    </div>
  </div>
</section>
{% endblock %}
